name: leasegate

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leasegate
      POSTGRES_USER: leasegate
      POSTGRES_PASSWORD_FILE: /run/leasegate-secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets:/run/leasegate-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasegate -d leasegate"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/leasegate-secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/leasegate-secrets/minio_password
    volumes:
      - object-data:/data
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.cloud
      args:
        LEASEGATE_RUNTIME_UID: ${LEASEGATE_RUNTIME_UID:-1000}
        LEASEGATE_RUNTIME_GID: ${LEASEGATE_RUNTIME_GID:-1000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYLEASE_DATABASE_URL_FILE: /run/leasegate-secrets/database_url
      KEYLEASE_ADMIN_TOKEN_FILE: /run/leasegate-secrets/admin_token
      KEYLEASE_CONTROL_SIGNING_KEY_FILE: /run/leasegate-secrets/control_signing_key
      KEYLEASE_CLOUD_LISTEN: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]
    read_only: true
    tmpfs: [/tmp]

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.cloud
      args:
        LEASEGATE_RUNTIME_UID: ${LEASEGATE_RUNTIME_UID:-1000}
        LEASEGATE_RUNTIME_GID: ${LEASEGATE_RUNTIME_GID:-1000}
    entrypoint: ["keylease-cloud-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYLEASE_DATABASE_URL_FILE: /run/leasegate-secrets/database_url
      KEYLEASE_WORKER_INTERVAL_SECONDS: 5
      KEYLEASE_SIEM_SECRETS_FILE: /run/leasegate-secrets/siem-secrets.json
      LEASEGATE_INSTANCE_ID: ${LEASEGATE_INSTANCE_ID:-worker-1}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]
    read_only: true
    tmpfs: [/tmp]

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.approval
      args:
        KEYLEASE_CLOUD_URL: https://${LEASEGATE_DOMAIN}/api
        KEYLEASE_ORGANIZATION_ID: ${KEYLEASE_ORGANIZATION_ID:-}
        KEYLEASE_PROJECT_ID: ${KEYLEASE_PROJECT_ID:-}
        KEYLEASE_APPROVER_ID: ${KEYLEASE_APPROVER_ID:-}
        KEYLEASE_AGENT_ID: ${LEASEGATE_AGENT_ID:-}
    restart: unless-stopped
    depends_on: [control-plane]
    environment:
      LEASEGATE_DOMAIN: ${LEASEGATE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [control]

  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
      args:
        LEASEGATE_RUNTIME_UID: ${LEASEGATE_RUNTIME_UID:-1000}
        LEASEGATE_RUNTIME_GID: ${LEASEGATE_RUNTIME_GID:-1000}
    restart: unless-stopped
    depends_on: [web]
    environment:
      LEASEGATE_DEPLOYMENT_MODE: ${LEASEGATE_DEPLOYMENT_MODE:-self_hosted}
      LEASEGATE_EXECUTION_MODE: ${LEASEGATE_EXECUTION_MODE:-local_gateway}
      LEASEGATE_EDGE_ID: ${LEASEGATE_EDGE_ID}
      LEASEGATE_ORGANIZATION_ID: ${KEYLEASE_ORGANIZATION_ID}
      LEASEGATE_PROJECT_ID: ${KEYLEASE_PROJECT_ID}
      LEASEGATE_AGENT_ID: ${LEASEGATE_AGENT_ID}
      LEASEGATE_EDGE_STATE: /var/lib/leasegate/edge.sqlite3
      LEASEGATE_VAULT_DB: /var/lib/leasegate/vault.sqlite3
      LEASEGATE_EDGE_STORAGE_KEY_FILE: /run/leasegate-secrets/edge_storage_key
      LEASEGATE_EDGE_CREDENTIAL_FILE: /run/leasegate-secrets/edge_credential
      LEASEGATE_AGENT_CREDENTIAL_FILE: /run/leasegate-secrets/agent_credential
      LEASEGATE_CREDENTIAL_BACKENDS_FILE: /run/leasegate-secrets/credential_backends.json
      LEASEGATE_VAULT_PASSWORD_FILE: /run/leasegate-secrets/vault_password
      LEASEGATE_CONTROL_VERIFYING_KEY: ${LEASEGATE_CONTROL_VERIFYING_KEY}
      LEASEGATE_CLOUD_URL: https://${LEASEGATE_DOMAIN}/api
      LEASEGATE_EDGE_LISTEN: 0.0.0.0:8090
      LEASEGATE_MCP_ALLOWED_HOSTS: ${LEASEGATE_MCP_ALLOWED_HOSTS:-127.0.0.1:8090}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - edge-data:/var/lib/leasegate
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]

networks:
  control:
    internal: false

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:
  edge-data:
