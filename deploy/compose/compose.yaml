name: leasegate

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: leasegate
      POSTGRES_USER: leasegate
      POSTGRES_PASSWORD_FILE: /run/leasegate-secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets:/run/leasegate-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasegate -d leasegate"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/leasegate-secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/leasegate-secrets/minio_password
    volumes:
      - object-data:/data
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]

  control-plane:
    image: ${KEYLEASE_CONTROL_IMAGE:-keylease-server:local}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
      args:
        KEYLEASE_RUNTIME_UID: ${KEYLEASE_RUNTIME_UID:-1000}
        KEYLEASE_RUNTIME_GID: ${KEYLEASE_RUNTIME_GID:-1000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYLEASE_DATABASE_URL_FILE: /run/leasegate-secrets/database_url
      KEYLEASE_ADMIN_TOKEN_FILE: /run/leasegate-secrets/admin_token
      KEYLEASE_CONTROL_SIGNING_KEY_FILE: /run/leasegate-secrets/control_signing_key
      KEYLEASE_OPERATIONS_STATUS_FILE: /run/leasegate-ops/operations-status.json
      KEYLEASE_SERVER_LISTEN: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./secrets:/run/leasegate-secrets:ro
      - ./.state:/run/leasegate-ops:ro
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "keylease-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    image: ${KEYLEASE_CONTROL_IMAGE:-keylease-server:local}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
      args:
        KEYLEASE_RUNTIME_UID: ${KEYLEASE_RUNTIME_UID:-1000}
        KEYLEASE_RUNTIME_GID: ${KEYLEASE_RUNTIME_GID:-1000}
    entrypoint: ["keylease-server-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYLEASE_DATABASE_URL_FILE: /run/leasegate-secrets/database_url
      KEYLEASE_WORKER_INTERVAL_SECONDS: 5
      # Empty by default for the single-VPS profile. Set the container path
      # explicitly only when the optional enterprise SIEM exporter is enabled.
      KEYLEASE_SIEM_SECRETS_FILE: ${KEYLEASE_SIEM_SECRETS_FILE:-}
      KEYLEASE_INSTANCE_ID: ${KEYLEASE_INSTANCE_ID:-worker-1}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]
    read_only: true
    tmpfs: [/tmp]

  web:
    image: ${KEYLEASE_WEB_IMAGE:-keylease-approval-web:local}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.approval
      args:
        KEYLEASE_CLOUD_URL: https://${KEYLEASE_DOMAIN}/api
        KEYLEASE_ORGANIZATION_ID: ${KEYLEASE_ORGANIZATION_ID:-}
        KEYLEASE_PROJECT_ID: ${KEYLEASE_PROJECT_ID:-}
        KEYLEASE_APPROVER_ID: ${KEYLEASE_APPROVER_ID:-}
        KEYLEASE_AGENT_ID: ${KEYLEASE_AGENT_ID:-}
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      KEYLEASE_DOMAIN: ${KEYLEASE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [control]

  gateway:
    image: ${KEYLEASE_GATEWAY_IMAGE:-keylease-edge:local}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
      args:
        KEYLEASE_RUNTIME_UID: ${KEYLEASE_RUNTIME_UID:-1000}
        KEYLEASE_RUNTIME_GID: ${KEYLEASE_RUNTIME_GID:-1000}
    restart: unless-stopped
    depends_on: [web]
    environment:
      KEYLEASE_DEPLOYMENT_MODE: ${KEYLEASE_DEPLOYMENT_MODE:-self_hosted}
      KEYLEASE_EXECUTION_MODE: ${KEYLEASE_EXECUTION_MODE:-local_gateway}
      KEYLEASE_EDGE_ID: ${KEYLEASE_EDGE_ID}
      KEYLEASE_ORGANIZATION_ID: ${KEYLEASE_ORGANIZATION_ID}
      KEYLEASE_PROJECT_ID: ${KEYLEASE_PROJECT_ID}
      KEYLEASE_AGENT_ID: ${KEYLEASE_AGENT_ID}
      KEYLEASE_EDGE_STATE: /var/lib/leasegate/edge.sqlite3
      KEYLEASE_VAULT_DB: /var/lib/leasegate/vault.sqlite3
      KEYLEASE_EDGE_STORAGE_KEY_FILE: /run/leasegate-secrets/edge_storage_key
      KEYLEASE_EDGE_CREDENTIAL_FILE: /run/leasegate-secrets/edge_credential
      KEYLEASE_AGENT_CREDENTIAL_FILE: /run/leasegate-secrets/agent_credential
      KEYLEASE_CREDENTIAL_BACKENDS_FILE: /run/leasegate-secrets/credential_backends.json
      KEYLEASE_VAULT_PASSWORD_FILE: /run/leasegate-secrets/vault_password
      KEYLEASE_CONTROL_VERIFYING_KEY: ${KEYLEASE_CONTROL_VERIFYING_KEY}
      KEYLEASE_CLOUD_URL: https://${KEYLEASE_DOMAIN}/api
      KEYLEASE_EDGE_LISTEN: 0.0.0.0:8090
      KEYLEASE_MCP_ALLOWED_HOSTS: ${KEYLEASE_MCP_ALLOWED_HOSTS:-127.0.0.1:8090}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - edge-data:/var/lib/leasegate
      - ./secrets:/run/leasegate-secrets:ro
    networks: [control]
    healthcheck:
      test: ["CMD", "keylease-edge", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  control:
    internal: false

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:
  edge-data:
