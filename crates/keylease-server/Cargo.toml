[package]
name = "keylease-server"
description = "Self-hosted KeyLease server: sync, sharing, organizations and the console"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
keylease-core = { path = "../keylease-core", version = "0.2.1" }
keylease-crypto = { path = "../keylease-crypto", version = "0.2.1" }
keylease-protocol = { path = "../keylease-protocol", version = "0.2.1" }
keylease-connector-sdk = { path = "../keylease-connector-sdk", version = "0.2.1" }
keylease-connectors = { path = "../keylease-connectors", version = "0.2.1" }
keylease-credentials = { path = "../keylease-credentials", version = "0.2.1" }
keylease-policy = { path = "../keylease-policy", version = "0.2.1" }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sqlx = { workspace = true, default-features = false }
subtle.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "std"] }
http-body-util = "0.1"
tempfile.workspace = true

[[bin]]
name = "keylease-server"
path = "src/main.rs"

[[bin]]
name = "keylease-server-worker"
path = "src/bin/worker.rs"
