[package]
name = "keylease-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KeyLease vault service: policy, approvals, trust, SSH signing, SCRAM and secret injection"
repository.workspace = true
homepage.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
keylease-core = { path = "../keylease-core", version = "0.1.0" }
keylease-1pux = { path = "../keylease-1pux", version = "0.1.0" }
keylease-kdbx = { path = "../keylease-kdbx", version = "0.1.0" }
keylease-store = { path = "../keylease-store", version = "0.1.0" }
leasegate-connectors = { path = "../leasegate-connectors", version = "0.1.0" }
leasegate-policy = { path = "../leasegate-policy", version = "0.1.0" }
rand.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
totp-rs.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rsa", "p256", "p384", "encryption", "rand_core", "getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
signature = "2"
hmac.workspace = true
pbkdf2 = "0.12"

[dev-dependencies]
tempfile.workspace = true
