[package]
name = "keylease-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "keylease"
path = "src/main.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
clap.workspace = true
keylease-core = { path = "../keylease-core" }
keylease-rpc = { path = "../keylease-rpc" }
keylease-service = { path = "../keylease-service" }
keylease-store = { path = "../keylease-store" }
leasegate-connectors = { path = "../leasegate-connectors" }
leasegate-policy = { path = "../leasegate-policy" }
rand.workspace = true
rpassword.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
zeroize.workspace = true
