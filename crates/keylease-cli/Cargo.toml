[package]
name = "keylease"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local-first secret vault that lets AI agents use credentials without seeing them: CLI, daemon, SSH/database brokers and MCP server"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["secrets", "vault", "ai-agents", "ssh-agent", "mcp"]
categories = ["cryptography", "authentication"]

[[bin]]
name = "keylease"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
keylease-core = { path = "../keylease-core", version = "0.2.1" }
keylease-rpc = { path = "../keylease-rpc", version = "0.2.1" }
keylease-service = { path = "../keylease-service", version = "0.2.1" }
keylease-store = { path = "../keylease-store", version = "0.2.1" }
leasegate-connectors = { path = "../leasegate-connectors", version = "0.2.1" }
leasegate-policy = { path = "../leasegate-policy", version = "0.2.1" }
rand.workspace = true
reqwest.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
rpassword.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
tempfile.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
zeroize.workspace = true

[dev-dependencies]
http-body-util = "0.1"
sha2.workspace = true
tower = { workspace = true, features = ["util"] }
