[package]
name = "keylease-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# cdylib   -> libkeylease_mobile.so for Android.
# staticlib-> a future iOS build; free to keep now.
# rlib     -> lets tests/ffi.rs call the extern "C" surface directly on the
#             host, which is how this layer is verified without a device.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# The Kotlin client in apps/mobile-android reaches the same cores through JNI
# exports instead of the C ABI. Off by default so the host test suite and the
# Flutter cdylib do not link the JVM-facing surface.
default = []
jni = ["dep:jni"]

[dependencies]
# default-features = false drops the agent handoff dispatch arms. The wire type
# is unchanged; the two commands answer `denied` instead.
keylease-rpc = { path = "../keylease-rpc", version = "0.2.1", default-features = false, features = ["provisioning"] }
keylease-core = { path = "../keylease-core", version = "0.2.1" }
keylease-service = { path = "../keylease-service", version = "0.2.1" }
keylease-store = { path = "../keylease-store", version = "0.2.1" }
serde_json.workspace = true
tokio = { workspace = true }
zeroize.workspace = true
jni = { version = "0.21", optional = true }

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
