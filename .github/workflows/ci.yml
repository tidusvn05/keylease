name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      KEYLEASE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      KEYLEASE_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version and components.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The root key in a hardware security module, against SoftHSM.
      - name: PKCS#11 (SoftHSM)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s/softhsm/tokens\nobjectstore.backend = file\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf"
          softhsm2-util --init-token --free --label keylease-test --pin 1234 --so-pin 4321
          cargo clippy -p keylease-server --features pkcs11 --all-targets -- -D warnings
          KEYLEASE_TEST_PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so cargo test -p keylease-server --features pkcs11 --test kms_providers

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/console/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
