name: macOS app

# Builds KeyLease.app (universal2, with the keylease helper inside), runs the Swift tests and packs
# an ad-hoc signed DMG, kept as a workflow artifact. Runs on pull requests that touch the app or its
# packaging, and on demand. Releases do not ship the app (docs/releasing.md, "The macOS app").

on:
  pull_request:
    paths:
      - apps/desktop-macos/**
      - apps/desktop-macos-app/**
      - scripts/package-macos-swift.sh
      - scripts/prepare-macos-runtime.sh
      - scripts/macos-signing-identity.sh
      - .github/workflows/macos.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: KeyLease.app
    # macOS 15 images ship Xcode 16 (swift-tools-version 6.0).
    runs-on: macos-15
    env:
      EXPANDED_CODE_SIGN_IDENTITY: "-"
      DMG: KeyLease-macos-universal.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count is the app's CFBundleVersion.
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
      - run: swift --version
      - run: swift test --package-path apps/desktop-macos
      - run: swift test --package-path apps/desktop-macos-app
      - name: Third-party licenses of the keylease helper
        run: |
          cargo install --locked cargo-about --features cli
          cargo about generate --manifest-path crates/keylease-cli/Cargo.toml \
            --target aarch64-apple-darwin packaging/about.hbs -o THIRD_PARTY_LICENSES.md
      - name: Build and pack
        run: |
          mkdir -p dist
          KEYLEASE_DMG="$PWD/dist/$DMG" scripts/package-macos-swift.sh --dmg
          codesign --display --verbose=2 build/macos-swift/KeyLease.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" \
            build/macos-swift/KeyLease.app/Contents/Info.plist
          build/macos-swift/KeyLease.app/Contents/Resources/keylease --version
      - uses: actions/upload-artifact@v7
        with:
          name: keylease-macos-app
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
