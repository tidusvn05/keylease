name: keylease_desktop
description: KeyLease cross-platform presentation client
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  # The shared client. A path dependency rather than a pub workspace: a
  # workspace solves versions once across all members, and this app pins
  # flutter_lints ^5 while apps/approval-flutter pins ^6, which cannot
  # co-resolve. Revisit once those agree.
  leasegate_vault_ui:
    path: ../../packages/leasegate_vault_ui
  # Production UI library. Forui is 0.x, so the version is pinned exactly and
  # upgrades go through the changelog review recorded in docs/.
  forui: 0.26.0
  # Flutter 3.47 moved Material out of the SDK. Forui 0.26 builds on the
  # package, so the app must use the same one for theme/type compatibility.
  material_ui: 1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
