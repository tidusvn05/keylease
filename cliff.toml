# git-cliff configuration: CHANGELOG.md and release notes from commit messages.
# See docs/releasing.md. Generate with: git cliff --tag vX.Y.Z -o CHANGELOG.md
#
# New commits use Conventional Commits (feat:, fix:, docs:, ...). Commits from before
# the first release use plain imperative subjects ("Add ...", "Fix ..."); the parsers
# below sort both.

[changelog]
header = """
# Changelog

All notable changes to KeyLease are listed here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and KeyLease uses
[Semantic Versioning](https://semver.org/) (see docs/releasing.md). This file is
generated from commit messages by git-cliff.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build and packaging" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->Dependencies" },
  { message = "^(chore|test|style)", group = "<!-- 8 -->Other" },
  # Subjects from before Conventional Commits.
  { message = "^(Add|Implement|Introduce|Support|Allow|Enable|Build|Create)", group = "<!-- 0 -->Features" },
  { message = "^(Fix|Close|Harden|Guard|Prevent|Repair|Restore|Preserve)", group = "<!-- 1 -->Bug fixes" },
  { message = "^(Document|Record|Explain)", group = "<!-- 4 -->Documentation" },
  { message = "^Update dependencies", group = "<!-- 7 -->Dependencies" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
