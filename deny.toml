# cargo deny check — run in CI. Keep exceptions here with a reason.

[graph]
all-features = true

[advisories]
ignore = [
    # rsa: Marvin timing side channel. No fixed release yet (0.10 is RC).
    # KeyLease only signs with RSA keys inside the vault for `keylease ssh`;
    # it never decrypts with RSA. Prefer Ed25519 keys; revisit with rsa 0.10.
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; signing only, Ed25519 preferred" },
    # crypto-bigint 0.5 through ssh-key 0.6 (p256/p384). Fixed in 0.7, which
    # ssh-key only uses in its 0.7 release candidates.
    { id = "RUSTSEC-2026-0387", reason = "fixed only in ssh-key 0.7 RCs; ECDSA host keys are rarely vault keys" },
    # basic-toml is unmaintained (not vulnerable). age pulls it in through
    # i18n-config, which only parses age's own embedded i18n.toml at build time.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, not vulnerable; build-time parse of age's own i18n config" },
    # SQLite < 3.54 (libsqlite3-sys < 0.39) can leak page-cache memory when it
    # opens a database together with a crafted `-wal` file. The fix needs
    # rusqlite 0.41+, which cargo refuses while sqlx 0.9 (Postgres only here,
    # but its optional sqlx-sqlite stays in the lockfile) caps
    # libsqlite3-sys below 0.38. KeyLease opens only its own vault files.
    { id = "RUSTSEC-2026-0459", reason = "blocked by sqlx 0.9's libsqlite3-sys cap; only own vault files are opened; bump rusqlite when sqlx allows" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
