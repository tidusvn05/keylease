name: KeyLease secrets
description: >
  Load a KeyLease Managed project environment into the job's environment with
  the job's OIDC token (a KeyLease machine identity). Every value is masked in
  the logs. No long-lived secret is stored in the repository.
inputs:
  server:
    description: The KeyLease server's API URL (e.g. https://vault.example.com/api).
    required: true
  identity:
    description: The machine identity (mid_…) a project admin created.
    required: true
  audience:
    description: The audience the machine identity expects.
    required: false
    default: keylease
runs:
  using: composite
  steps:
    - name: Load secrets from KeyLease
      shell: bash
      env:
        KEYLEASE_SERVER_URL: ${{ inputs.server }}
        KEYLEASE_MACHINE_IDENTITY: ${{ inputs.identity }}
        KEYLEASE_AUDIENCE: ${{ inputs.audience }}
      run: '"$GITHUB_ACTION_PATH/load.sh"'
